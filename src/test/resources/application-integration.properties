# Perfil "integration": a diferencia de application-test.properties (H2 en
# memoria, sin Docker), este perfil apunta a la base Postgres real levantada
# con `docker compose up -d` (mismas credenciales que docker-compose.yml),
# validando el schema real (proyecto_schema.sql) — no uno regenerado por
# Hibernate. Ver ComentarioConfidencialInstanciaIT (M15) para el motivo:
# entidades con @EmbeddedId + @MapsId (clave compuesta) no se pueden
# verificar de forma confiable con Mockito, solo contra una base real.

spring.datasource.url=jdbc:postgresql://localhost:5432/sienep?currentSchema=proyecto
spring.datasource.username=sienep
spring.datasource.password=sienep

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

DB_URL=jdbc:postgresql://localhost:5432/sienep?currentSchema=proyecto
DB_USER=sienep
DB_PASSWORD=sienep
JWT_SECRET=test-secret-key-only-for-integration-sienep

# ── Brevo (valor dummy para que el contexto cargue) ───────────
BREVO_API_KEY=dummy-brevo-api-key

# ── Google Calendar Service Account (valores dummy para que el contexto cargue) ─
GOOGLE_CALENDAR_ENABLED=false
GOOGLE_CALENDAR_CALENDAR_ID=dummy-calendar-id
GOOGLE_CALENDAR_IMPERSONATE_ACCOUNT=dummy@dummy.com
GOOGLE_CALENDAR_APPLICATION_NAME=SIENEP-test

# ── Almacenamiento de archivos subidos ────────────────────────
STORAGE_PATH=${java.io.tmpdir}/sienep-integration-storage
