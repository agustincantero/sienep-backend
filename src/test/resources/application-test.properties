# ── Datasource H2 (in-memory) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS proyecto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Resolución de variables del application.properties ───────
DB_URL=jdbc:h2:mem:testdb
DB_USER=sa
DB_PASSWORD=
JWT_SECRET=test-secret-key-only-for-context-load-sienep

# ── Mail (valores dummy para que el contexto cargue) ─────────
MAIL_HOST=localhost
MAIL_PORT=25
MAIL_USERNAME=test@test.com
MAIL_PASSWORD=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false