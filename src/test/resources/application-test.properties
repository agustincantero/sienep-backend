# ── Datasource H2 (in-memory) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS proyecto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Resolución de variables del application.properties ───────
DB_URL=jdbc:h2:mem:testdb
DB_USER=sa
DB_PASSWORD=
JWT_SECRET=test-secret-key-only-for-context-load-sienep

# ── Brevo (valor dummy para que el contexto cargue) ───────────
BREVO_API_KEY=dummy-brevo-api-key

# ── Google OAuth2 (valores dummy para que el contexto cargue) ─
GOOGLE_CLIENT_ID=dummy-client-id
GOOGLE_CLIENT_SECRET=dummy-client-secret
GOOGLE_REDIRECT_URI=http://localhost:8080/callback

# ── Almacenamiento de archivos subidos ────────────────────────
STORAGE_PATH=${java.io.tmpdir}/sienep-test-storage