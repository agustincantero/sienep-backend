# ── Datasource H2 (in-memory) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS proyecto
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── Resolución de variables del application.properties ───────
DB_URL=jdbc:h2:mem:testdb
DB_USER=sa
DB_PASSWORD=
JWT_SECRET=test-secret-key-only-for-context-load-sienep

# ── Brevo (valor dummy para que el contexto cargue) ───────────
BREVO_API_KEY=dummy-brevo-api-key

# ── Google Calendar Service Account (valores dummy para que el contexto cargue) ─
# enabled=false: el código nunca parsea GOOGLE_CALENDAR_CREDENTIALS en este perfil.
GOOGLE_CALENDAR_ENABLED=false
GOOGLE_CALENDAR_CALENDAR_ID=dummy-calendar-id
GOOGLE_CALENDAR_IMPERSONATE_ACCOUNT=dummy@dummy.com
GOOGLE_CALENDAR_APPLICATION_NAME=SIENEP-test

# ── Almacenamiento de archivos subidos ────────────────────────
STORAGE_PATH=${java.io.tmpdir}/sienep-test-storage

# ── Cifrado en reposo (clave fija solo para tests, sin datos reales) ─────────
