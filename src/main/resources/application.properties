spring.application.name=sienep

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=proyecto

jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Apagar en producción: SWAGGER_ENABLED=false (default true, no rompe local/tests)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Google Calendar — Service Account con domain-wide delegation (GoogleCalendarService).
# google.calendar.credentials es el JSON completo de la service account (NUNCA un
# archivo en el repo, siempre la variable de entorno). Con enabled=false (default),
# la sync queda en modo simulado — no hace falta cargar credenciales reales en dev/test.
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
google.calendar.credentials=${GOOGLE_CALENDAR_CREDENTIALS:}
google.calendar.calendar-id=${GOOGLE_CALENDAR_CALENDAR_ID:}
google.calendar.impersonate-account=${GOOGLE_CALENDAR_IMPERSONATE_ACCOUNT:}
google.calendar.application-name=${GOOGLE_CALENDAR_APPLICATION_NAME:SIENEP}

# API HTTP de Brevo (no SMTP): ver BrevoConfig / EmailService.
brevo.api-key=${BREVO_API_KEY}
# Habilita el soporte para proxies (Cloudflare)
server.forward-headers-strategy=framework

# Almacenamiento de archivos subidos (informes adjuntos, foto de estudiante) - filesystem local
app.storage.base-dir=${STORAGE_PATH:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# URL base del frontend, para armar el link del email de "olvidé mi contraseña"
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Orígenes permitidos para CORS (separados por coma) — dev local y prod
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://sienep.app}